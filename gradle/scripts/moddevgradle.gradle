neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    var isJbr = System.getProperty('java.vm.vendor').contains('JetBrains')

    runs {
        client {
            client()
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // 锅里的液面边框用的是**上游 AnvilCraft 的贴图**（anvilcraft:block/*_metal_block_outline），
            // 而 datagen 的资源校验默认只认原版 + 本模组，不加这条会直接失败：
            // "Texture anvilcraft:block/frost_metal_block_outline does not exist in any known resource pack"
            programArguments.addAll '--existing-mod', 'anvilcraft'
        }

        configureEach {
            if (isJbr) {
                jvmArgument "-XX:+AllowEnhancedClassRedefinition"
            }
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
