[versions]
minecraft = "1.21.1"
neoForge = "21.1.241"
kotlinforforge = "5.9.0"
anvillib = "2.0.0+snapshot.534"
anvilcraft = "1.6.0+snapshot.2339"
modDevGradle = "2.0.142"
lombok = "8.7.1"
# JEI 只用于编译期（写 JEI 插件）；运行时的 JEI 由玩家自己装，所以不写 runtimeOnly，
# 否则会和玩家自己放进 mods 的 JEI 撞车（同一个 mod 两份 jar）。
jei = "19.27.0.340"

[libraries]
kotlinforforge = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kotlinforforge" }
anvillib = { group = "dev.anvilcraft.lib", name = "anvillib-neoforge-1.21.1", version.ref = "anvillib" }
anvilcraft = { group = "dev.dubhe", name = "anvilcraft-neoforge-1.21.1", version.ref = "anvilcraft" }
jei-api = { group = "mezz.jei", name = "jei-1.21.1-neoforge-api", version.ref = "jei" }

[plugins]
modDevGradle = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
